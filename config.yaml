# Configuration MKM Optimizer
# Tout ce qui ici peut être surchargé par config.local.yaml (gitignored).

wantlist:
  # ID de la wantlist MKM par défaut (visible dans l'URL /Wants/<id>)
  default_id: 23837361

# Filtres sur les offres considérées
filters:
  # Pays vendeur (FR, DE, BE, ES, IT, etc. ou null = tous)
  seller_country: FR

  # Type vendeur :  any | private | commercial | powerseller
  # (sur MKM "professional" recouvre commercial + powerseller)
  seller_type: commercial

  # Note minimale du vendeur sur 5
  min_reputation: 4.0

  # Pseudos vendeurs à toujours ignorer (problèmes passés, etc.)
  excluded_sellers: []

  # État minimum accepté (MT > NM > EX > GD > LP > PL > PO)
  min_condition: EX

  # Langues acceptées (codes ISO 2 lettres MKM)
  languages: [fr, en]

  # Foil : true (foil obligatoire) | false (non-foil obligatoire) | any
  foil: any

  # Plafond de prix unitaire (€) : toute offre au-dessus est écartée avant le
  # solveur. Évite que des listings « poubelle » à prix aberrant (ex. une
  # commune affichée à 1000 €) polluent les scénarios à vendeurs limités.
  # null = pas de plafond.
  max_offer_price: 20

# Frais de port — barème UNIQUE pour tous les vendeurs (palier par nb cartes).
# Si un palier ne s'applique pas, le solveur écarte simplement le vendeur.
shipping:
  brackets:
    - { max_cards: 40,  cost: 4.10 }   # lettre suivie
    - { max_cards: 100, cost: 6.50 }
    - { max_cards: 500, cost: 8.60 }   # 101 cartes et +

# Optimisation
optimization:
  # Nombre max de vendeurs dans la solution (contrainte MIP)
  max_vendors: 5

  # Au-delà de ces seuils, bascule sur l'heuristique gourmande (non implémentée encore)
  exact_threshold:
    unique_cards: 150
    total_units: 400

  # Scénarios générés à chaque run.
  # Pour chaque scénario, le solveur minimise : coût cartes + FDP + pénalité
  # par carte non couverte (1e4 €) + `vendor_fixed_cost` par vendeur sélectionné.
  #
  # `vendor_fixed_cost` (€) : pénalité ajoutée à l'objectif pour chaque vendeur
  # sélectionné, EN PLUS du FDP réel. À 0 = comportement classique. À 10 €
  # par exemple, un vendeur n'est gardé que s'il fait économiser plus de
  # 10 € en plus de couvrir son FDP — utile pour obtenir un panier frugal.
  scenarios:
    - { name: "max_3_vendeurs", max_vendors: 3 }
    - { name: "max_5_vendeurs", max_vendors: 5 }
    - { name: "max_6_vendeurs", max_vendors: 6 }
    - { name: "max_7_vendeurs", max_vendors: 7 }
    - { name: "min_prix_min_vendeurs", max_vendors: null, vendor_fixed_cost: 10 }

# Cache des offres scrapées (durée de validité)
cache:
  ttl_hours: 24
  sqlite_path: .cache/offers.sqlite

# Rate limit (utilisé seulement par l'option B — Playwright)
rate_limit:
  min_delay_ms: 300
  max_delay_ms: 800
